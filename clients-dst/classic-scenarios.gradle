// Experimental JDK 25 / Panama scenario runner, separate from Java 17 test sources.
sourceSets {
  classicScenarios {
    compileClasspath += sourceSets.test.output + configurations.testRuntimeClasspath
    runtimeClasspath += output + compileClasspath
  }
}
configurations.classicScenariosImplementation.extendsFrom(configurations.testImplementation)
dependencies {
  classicScenariosImplementation libs.jacksonDatabind
}
tasks.named('compileClassicScenariosJava', JavaCompile) {
  dependsOn testClasses
  options.release = 25
}
tasks.register('classicScenarios', JavaExec) {
  dependsOn classicScenariosClasses
  classpath = sourceSets.classicScenarios.runtimeClasspath
  mainClass = 'org.apache.kafka.clients.dst.compat.SharedScenarioRunner'
  jvmArgs '--enable-native-access=ALL-UNNAMED'
  maxHeapSize = '3g'
  if (System.getProperty('kr.sim.library') != null)
    systemProperty 'kr.sim.library', System.getProperty('kr.sim.library')
  if (providers.gradleProperty('scenarioArgsJson').isPresent())
    args new groovy.json.JsonSlurper().parseText(providers.gradleProperty('scenarioArgsJson').get())
  else
    args providers.gradleProperty('scenarioArgs').getOrElse('').split(' ').findAll { !it.isEmpty() }
}
