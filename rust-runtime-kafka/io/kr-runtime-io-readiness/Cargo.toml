[package]
name = "kr-runtime-io-readiness"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Bounded Linux epoll provider for owned runtime stream operations"
license = "Apache-2.0 OR MIT"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
kr-runtime = { path = "../.." }
kr-runtime-io = { path = "../kr-runtime-io" }
rustix = { version = "=1.1.4", features = ["event", "net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
kr-runtime-io = { path = "../kr-runtime-io", features = ["test-support"] }

[lints]
workspace = true
