[package]
name = "kr-kafka-experiments"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Replayable Kafka producer experiments and bounded chart artifacts"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
kr-kafka-sim = { path = "../kr-kafka-sim" }
kr-kafka-producer = { path = "../kr-kafka-producer" }
kr-kafka-record = { path = "../kr-kafka-record" }
kr-runtime = { path = "../.." }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = "0.11"

[lints]
workspace = true
