[package]
name = "kr-kafka-sim-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
