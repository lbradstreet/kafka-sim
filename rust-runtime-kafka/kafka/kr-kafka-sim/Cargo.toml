[package]
name = "kr-kafka-sim"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Replayable producer actor simulation and independent domain oracle"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
kr-kafka-client = { path = "../kr-kafka-client", features = ["request-observation"] }
kr-runtime = { path = "../..", features = ["test-support"] }
kr-runtime-io = { path = "../../io/kr-runtime-io", features = ["test-support"] }
kr-runtime-trace-tool = { path = "../../tools/trace-tool" }
kr-kafka-producer = { path = "../kr-kafka-producer" }
kr-kafka-protocol = { path = "../kr-kafka-protocol" }
kr-kafka-record = { path = "../kr-kafka-record" }
kr-kafka-broker-model = { path = "../kr-kafka-broker-model" }
kr-shared-bytes = { path = "../../bytes/kr-shared-bytes" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
sha2 = "0.11"
