[package]
name = "kr-runtime-trace-tool"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Binary SBE trace artifacts and a static viewer for kr-runtime"
license = "Apache-2.0 OR MIT"
publish = false

[features]
benchmarks = ["dep:criterion"]

[dependencies]
criterion = { version = "0.7", optional = true }
kr-runtime = { path = "../.." }
kr-runtime-trace-wire = { path = "../../trace/kr-runtime-trace-wire" }

[dev-dependencies]
kr-runtime-io = { path = "../../io/kr-runtime-io", features = ["test-support"] }
kr-runtime-ring = { path = "../../storage/kr-runtime-ring", features = ["test-support"] }
kr-runtime-ring-trace-wire = { path = "../../trace/kr-runtime-ring-trace-wire" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[[bench]]
name = "trace_artifact"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true
